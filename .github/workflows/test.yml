name: Test

# Required to allow sticky-pull-request-comment to work
permissions:
  pull-requests: write

on:
  - pull_request
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # jekyll-last-modified-at needs the full git history to derive
          # correct "last updated" dates; a shallow clone reports the head
          # commit for every file, so the preview would not match production.
          fetch-depth: 0
      - name: Install Ruby 3
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test
      - name: Build jekyll html
        run: bundle exec rake build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-preview
        with:
          name: preview
          path: _site/
          retention-days: 7
          overwrite: true
          compression-level: 9
          if-no-files-found: error
